[book]
title = "notasi user manual"
authors = ["Hsin-Hao Yu"]
language = "en"
src = "src"

[build]
# Fail the build if SUMMARY.md links to a page that doesn't exist,
# instead of silently creating an empty one.
create-missing = false

[output.html]
# Hugo Book typography; theme/fonts/fonts.css is empty, so no web fonts.
additional-css = ["theme/custom.css"]
# No chapter numbers ("1.", "2.") in the sidebar.
no-section-label = true
git-repository-url = "https://github.com/hsinhaoyu/notasi"
edit-url-template = "https://github.com/hsinhaoyu/notasi/edit/dev/doc/manual/{path}"
