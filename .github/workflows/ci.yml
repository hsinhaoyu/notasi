name: CI

on:
  pull_request:
    branches: [dev, main]

env:
  # The tested Typst version (05, "Version pinning"). Change it on purpose.
  TYPST_VERSION: v0.15.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Guile
        run: |
          sudo apt-get update
          sudo apt-get install -y guile-3.0

      - name: Install Typst
        run: |
          url="https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "$url" | tar -xJ -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" "$HOME/.local/bin/typst"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/typst" --version

      - name: Run tests
        run: make check

      # The committed images are the ones drawn here, on Linux with the
      # pinned Typst (07, ADR 0052). Redraw them; if any changed, upload
      # the new ones for the PR to commit, and fail.
      - name: Check the committed images
        id: images
        run: |
          make images
          if [ -n "$(git status --porcelain -- examples/gallery/images examples/manual/images)" ]; then
            git status --short -- examples/gallery/images examples/manual/images
            echo "::error::The committed images are out of date. Download the 'images' artifact of this run and commit its files into examples/."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Upload the images drawn here
        if: failure() && steps.images.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: |
            examples/gallery/images/
            examples/manual/images/

  # The Emacs package (editors/emacs/, 08), on the oldest Emacs it
  # supports and the newest release (07, "Emacs users").
  emacs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '31.1']
    steps:
      - uses: actions/checkout@v4

      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs_version }}

      - name: Check the package
        run: make check-emacs
